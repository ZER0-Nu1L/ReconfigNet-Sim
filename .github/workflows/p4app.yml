name: P4App

on:
  pull_request:
    paths-ignore:
      - 'blog/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'blog/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4app-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and YANG
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            agent/python/requirements-runtime.txt
            agent/python/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/python/requirements-dev.txt

      - name: Run P4App host tests
        env:
          OCS_REQUIRE_GRPC_TESTS: '1'
        run: |
          python -m pip check
          python agent/proto/generate_python.py --check
          make -C targets/p4app test
          PYTHONPATH="$PWD/agent/python:$PWD/targets/tofino/runtime" \
            python -m unittest discover -s targets/tofino/runtime/tests -v

  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go/go.sum

      - name: Check Go formatting
        working-directory: agent/go
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        working-directory: agent/go
        run: go test -race ./...

  p4app-container:
    name: P4App container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up modern RPC client
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build and test P4App container
        run: |
          make -C targets/p4app test-container
          docker run --rm --entrypoint python3 \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            reconfig-net/ocs-p4app-agent-test:rc2 \
            /workspace/agent/proto/generate_python.py --flavor legacy --check

      - name: Exercise old and modern RPC runtimes and downgrade
        run: |
          python -m pip install -r agent/python/requirements-dev.txt
          docker run --rm --entrypoint cat reconfig-net/ocs-p4app-agent:rc2 \
            /usr/local/bin/ocs-go-agent > "$RUNNER_TEMP/ocs-go-agent"
          chmod +x "$RUNNER_TEMP/ocs-go-agent"
          python agent/proto/check_compatibility.py matrix \
            --go-agent "$RUNNER_TEMP/ocs-go-agent"

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whitespace
        run: git diff --check
