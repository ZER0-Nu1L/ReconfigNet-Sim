name: P4App

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4app-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and YANG
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            ocs.agent/requirements-agent.txt
            ocs.agent/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ocs.agent/requirements-dev.txt

      - name: Run P4App host tests
        run: make -C ocs.p4app/ocs.p4app-rc2 test

  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ocs.agent/go-agent/go.sum

      - name: Check Go formatting
        working-directory: ocs.agent/go-agent
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        working-directory: ocs.agent/go-agent
        run: go test ./...

  p4app-container:
    name: P4App container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test P4App container
        run: make -C ocs.p4app/ocs.p4app-rc2 test-container

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace
        run: git diff --check
