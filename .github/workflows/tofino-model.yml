name: Tofino model

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofino-model-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Tofino pipeline
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Load immutable image lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s targets/tofino/ci/tests -v
          python3 targets/tofino/ci/image_lock.py verify \
            --lock .github/tofino-image-lock.json \
            >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable Open P4 Studio image
        run: docker pull "$TOFINO_IMAGE"

      - name: Verify image contract
        run: |
          set -euo pipefail
          docker run --rm "$TOFINO_IMAGE" bash -ceu '
            test "$SDE" = /opt/open-p4studio
            test "$SDE_INSTALL" = /opt/open-p4studio/install
            test -x "$SDE_INSTALL/bin/bf-p4c"
            test -x "$SDE_INSTALL/bin/tofino-model"
            test -x "$SDE_INSTALL/bin/bf_switchd"
            test -x /usr/local/bin/open-p4studio-selftest
          '

      - name: Compile project pipeline and runtime tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/tofino-compile
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace/ReconfigNet-Sim:ro" \
            --volume "$GITHUB_WORKSPACE/artifacts/tofino-compile:/artifacts" \
            --workdir /workspace/ReconfigNet-Sim \
            "$TOFINO_IMAGE" \
            bash -ceu 'bash targets/tofino/ci/verify-model.sh /artifacts --compile-only'

      - name: Upload Tofino compile evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tofino-compile-${{ github.run_id }}
          path: artifacts/tofino-compile
          if-no-files-found: warn
          retention-days: 14

  model:
    name: Load, initialize, and test Tofino model
    needs: compile
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Load immutable image lock
        shell: bash
        run: |
          set -euo pipefail
          python3 targets/tofino/ci/image_lock.py verify \
            --lock .github/tofino-image-lock.json \
            >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable Open P4 Studio image
        run: docker pull "$TOFINO_IMAGE"

      - name: Load, initialize, and run project PTF in Tofino model
        run: |
          set -euo pipefail
          mkdir -p artifacts/tofino-model
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace/ReconfigNet-Sim:ro" \
            --volume "$GITHUB_WORKSPACE/artifacts/tofino-model:/artifacts" \
            --workdir /workspace/ReconfigNet-Sim \
            "$TOFINO_IMAGE" \
            bash -ceu 'bash targets/tofino/ci/verify-model.sh /artifacts'

      - name: Upload Tofino model evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tofino-model-${{ github.run_id }}
          path: artifacts/tofino-model
          if-no-files-found: warn
          retention-days: 14
