syntax = "proto3";

package reconfig_net.ocs.backend.v1;
option go_package = "github.com/reconfig-net-sim/ocs-go-agent/gen/backendv1;backendv1";

message Empty {}

message PortPair {
  uint32 ingress_port = 1;
  uint32 egress_port = 2;
}

message BackendCapabilities {
  string backend = 1;
  bool readback = 2;
  bool native_batch = 3;
  bool dataplane_atomic = 4;
  repeated string transports = 5;
  repeated string write_verifications = 6;
  repeated string readback_sources = 7;
}

message ReadEntriesResponse {
  repeated PortPair entries = 1;
  uint64 generation = 2;
  string cache_status = 3;
  uint64 last_verified_unix_ns = 4;
  uint64 last_reconcile_unix_ns = 5;
  uint64 drift_count = 6;
  string write_verification = 7;
  string readback_source = 8;
  uint64 last_write_ack_unix_ns = 9;
}

message OperationTiming {
  string strategy = 1;
  string transport = 2;
  uint64 planning_us = 3;
  uint64 delete_commit_us = 4;
  uint64 requested_gap_us = 5;
  uint64 actual_gap_us = 6;
  uint64 install_commit_us = 7;
  uint64 readback_us = 8;
  uint64 rollback_us = 9;
  uint64 programming_total_us = 10;
  uint32 delete_entries = 11;
  uint32 insert_entries = 12;
  uint32 unchanged_entries = 13;
  uint32 active_entries = 14;
  uint32 device_write_requests = 15;
  uint64 device_worker_total_us = 16;
  uint64 precondition_readback_us = 17;
  uint64 cache_precondition_us = 18;
  uint64 southbound_queue_wait_us = 19;
  string write_verification = 20;
  string readback_source = 21;
}

message ApplyTransitionRequest {
  repeated PortPair expected_entries = 1;
  repeated PortPair target_entries = 2;
  string strategy = 3;
  string transport = 4;
  uint64 delay_us = 5;
  uint64 expected_generation = 6;
}

message ApplyTransitionResponse {
  bool success = 1;
  bool restored = 2;
  string error = 3;
  string rollback_error = 4;
  string error_code = 5;
  repeated PortPair observed_entries = 6;
  OperationTiming timing = 7;
  uint64 generation = 8;
  string cache_status = 9;
  uint64 last_verified_unix_ns = 10;
  uint64 last_reconcile_unix_ns = 11;
  uint64 drift_count = 12;
  string write_verification = 13;
  string readback_source = 14;
  uint64 last_write_ack_unix_ns = 15;
}

message ReconcileRequest {
  repeated PortPair desired_entries = 1;
}

message RecoverRequest {
  repeated PortPair desired_entries = 1;
  string strategy = 2;
  string transport = 3;
  uint64 delay_us = 4;
}

service DeviceBackend {
  rpc Capabilities(Empty) returns (BackendCapabilities);
  rpc ReadEntries(Empty) returns (ReadEntriesResponse);
  rpc ApplyTransition(ApplyTransitionRequest)
      returns (ApplyTransitionResponse);
  rpc Reconcile(ReconcileRequest) returns (ReadEntriesResponse);
  rpc Recover(RecoverRequest) returns (ApplyTransitionResponse);
}
